// Runs before every class config (mastercomfig 9.x: run_game_overrides).
// Everything a class cfg may change is put back here, so pyro/heavy/engi
// binds can't leak into the next class.

// ---- reset class-specific keys ----
// release anything a class macro may still be holding (heavy M2 latch,
// pyro +panic / +detenenatorjump) - their keys are rebound below, so the
// key-up would never reach the old alias
-attack2
-attack
-right
-jump
-duck
cl_yawspeed 210
bind mouse2 +attack2
bind mouse3 +attack3
bind b      lastdisguise
unbind alt
unbind "\"
viewmodel_fov    110
r_drawviewmodel  1

// ---- quickswitch: 1/2/3, wheel and q (last weapon) ----
bind 1          eq_slot1
bind 2          eq_slot2
bind 3          eq_slot3
bind mwheelup   eq_invprev
bind mwheeldown eq_invnext
bind q          eq_lastinv

// Per-class hooks. Class cfgs redefine what they need:
//   set_slotN  - viewmodel per slot
//   slot_hookN - extra command when switching to that slot (heavy minigun M2)
alias set_slot1  ""
alias set_slot2  ""
alias set_slot3  ""
alias slot_hook1 ""
alias slot_hook2 ""
alias slot_hook3 ""

alias eq_slot1 "slot_hook1; slot1; set_slot1; alias eq_invnext eq_slot2; alias eq_invprev eq_slot3; qs_slot1; alias set_lastinv alias eq_lastinv eq_slot1; alias qs_slot1 ;            alias qs_slot2 set_lastinv; alias qs_slot3 set_lastinv"
alias eq_slot2 "slot_hook2; slot2; set_slot2; alias eq_invnext eq_slot3; alias eq_invprev eq_slot1; qs_slot2; alias set_lastinv alias eq_lastinv eq_slot2; alias qs_slot1 set_lastinv; alias qs_slot2 ;            alias qs_slot3 set_lastinv"
alias eq_slot3 "slot_hook3; slot3; set_slot3; alias eq_invnext eq_slot1; alias eq_invprev eq_slot2; qs_slot3; alias set_lastinv alias eq_lastinv eq_slot3; alias qs_slot1 set_lastinv; alias qs_slot2 set_lastinv; alias qs_slot3 "

// Class cfgs end with: eq_slot1 + alias eq_lastinv eq_slot2 (start on primary, q -> secondary)
