// heavy: hide the minigun viewmodel; on the minigun M2 toggles spin-up.
// Shared slot logic: game_overrides.cfg
alias set_slot1 "r_drawviewmodel 0"
alias set_slot2 "r_drawviewmodel 1"
alias set_slot3 "r_drawviewmodel 1"

alias m2_toggle  "m2_on"
alias m2_on      "alias m2_toggle m2_off; +attack2"
alias m2_off     "alias m2_toggle m2_on; -attack2"
alias slot_hook1 "bind mouse2 m2_toggle"
alias slot_hook2 "bind mouse2 +attack2; m2_off"
alias slot_hook3 "bind mouse2 +attack2; m2_off"

eq_slot1
alias eq_lastinv eq_slot2
