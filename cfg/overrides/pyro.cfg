// pyro: viewmodel fov per slot (yes_viewmodel.cfg), airblast crosshair,
// homewrecker/jetpack loadouts and the b/ALT macros.
// Everything here is undone by game_overrides.cfg on the next class.
alias set_slot1 viewmodel_slot_1
alias set_slot2 viewmodel_slot_2
alias set_slot3 viewmodel_slot_3

// M2: airblast, crosshair turns green while held
alias +airblast "+attack2; cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0; spec_prev"
alias -airblast "-attack2; cl_crosshair_blue 255; cl_crosshair_green 0; cl_crosshair_red 255"
bind mouse2 +airblast

// M3: homewrecker loadout (C) + melee; q: loadout D
alias homewrecker "load_itempreset 2; slot3"
bind mouse3 homewrecker
bind q "load_itempreset 3"

// b: spin
alias +panic "slot1; +attack; cl_yawspeed 30000000; +right"
alias -panic "-attack; cl_yawspeed 210; -right"
bind b +panic

// ALT: detonator jump
alias +detenenatorjump "+jump; +duck; +attack; +airblast"
alias -detenenatorjump "-jump; -duck; -attack; -airblast"
bind alt +detenenatorjump

eq_slot1
