mod_load_anims_async 0
mod_load_mesh_async 0
mod_load_vcollide_async 0

fps_max 0

sensitivity 2.6

// Force SDL relative-mouse mode instead of the engine's warp-to-center input.
// Warping is what breaks on XWayland when the pointer lock fails to engage at
// launch: the cursor snaps to the window centre every frame and the deltas
// read back as ~0. Raw input takes deltas from the device, not the cursor.
m_rawinput 1

// hitsound pitch, restored from the Windows config (git HEAD).
// config.cfg still holds the post-move values; this file execs after it,
// so these win. Steam Cloud can no longer undo them.
tf_dingaling_pitchmindmg 103.459999
tf_dingaling_pitchmaxdmg 104.000000

// Medic: latch the medigun beam on a single click instead of holding M1.
// This was set on Windows and was lost in the same stale Cloud restore.
tf_medigun_autoheal 1


exec yes_viewmodel
cl_hud_minmode 0

bind "f7" "prec_mark groat"

alias jetpack_loadout "load_itempreset 3"; //A = 0, ..., D = 3
alias default_loadout "load_itempreset 1";
alias dc disconnect;

alias jetpack_switch "tf_respawn_on_loadoutchanges 0; jetpack_loadout; join_class soldier; wait 200; join_class pyro; wait 50; default_loadout; slot2; tf_respawn_on_loadoutchanges 1"
bind kp_INS jetpack_switch;

alias jump "connect bulb.viora.sh"

alias kim

alias stfu "voice_enable 0"

bind "0" "slot10"
bind "1" "eq_slot1"
bind "2" "eq_slot2"
bind "3" "eq_slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "a" "+moveleft; kim"
bind "b" "+panic"
bind "c" "voice_menu_3"
bind "d" "+moveright; kim"
bind "e" "+helpme"
bind "f" "+inspect"
bind "g" "+taunt"
bind "i" "showmapinfo"
bind "j" "cl_trigger_first_notification"
bind "k" "cl_decline_first_notification"
bind "l" "dropitem"
bind "m" "open_charinfo_direct"
bind "n" "open_charinfo_backpack"
bind "o" "kill"
bind "p" "demo_togglepause"
bind "q" "eq_lastinv"
bind "r" "setpos -135.198486 -152.031250 916.900330;setang 40.648266 0.003528 0.000000"
bind "s" "+back; kim"
bind "t" "impulse 201"
bind "u" "say_team"
bind "v" "+voicerecord"
bind "w" "+forward; kim"
bind "x" "option"
bind "y" "say"
bind "z" "voice_menu_1"
bind "0" "jetpack_switch"
bind "KP_END" "join_class scout"
bind "KP_DOWNARROW" "join_class soldier"
bind "KP_PGDN" "join_class pyro"
bind "KP_LEFTARROW" "+bot"
bind "KP_5" "join_class heavyweapons"
bind "KP_RIGHTARROW" "join_class engineer"
bind "KP_HOME" "join_class medic"
bind "KP_UPARROW" "join_class sniper"
bind "KP_PGUP" "join_class spy"
bind "KP_MINUS" "load_itempreset 2"
bind "KP_PLUS" "load_itempreset 3"
bind "[" "say_party"
bind "]" "abuse_report_queue"
bind "'" "+moveup"
bind "`" "toggleconsole"
bind "," "changeclass"
bind "." "changeteam"
bind "/" "+movedown"
bind "\" "entrance"
bind "-" "disguiseteam"
bind "SPACE" "+jump"
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "PGUP" "+lookup"
bind "PGDN" "+lookdown"
bind "SHIFT" "+use_action_slot_item"
bind "ALT" "+detenenatorjump"
bind "CTRL" "+duck"
bind "F2" "show_quest_log"
bind "F3" "show_matchmaking"
bind "F4" "player_toggle_ready"
bind "F5" "screenshot"
bind "F6" "save_replay"
bind "F7" "prec_mark groat"
bind "F9" "vr_toggle"
bind "F11" "vr_reset_home_pos"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "+attack3"
bind "MOUSE4" "load_itempreset 1"
bind "MOUSE5" "load_itempreset 0"
bind "MWHEELUP" "eq_invprev"
bind "MWHEELDOWN" "eq_invnext"

bind w +mfwd
bind s +mback
bind a +mleft
bind d +mright

alias +mfwd "-back;+forward;alias checkfwd +forward"
alias +mback "-forward;+back;alias checkback +back"
alias +mleft "-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd none
alias checkback none
alias checkleft none
alias checkright none
alias none ""

cl_spec_carrieditems 1
tf_hud_no_crosshair_on_scope_zoom 0
spec_scoreboard 0
tf_scoreboard_mouse_mode 2

// gibs=off pulls in sillygibs_on (violence_* 0), which is Source low-violence
// mode -- that is what was spawning the cogs/springs on every death.
// This file execs after run_modules, so these win. Result: no gibs, no cogs,
// no ragdoll (ragdolls=off already force-fades it).
violence_hgibs 1
violence_hblood 1
violence_agibs 1
violence_ablood 1

// ---- Pinned from in-game changes (config.cfg, Sep 2026) ----
// config.cfg is what Steam Cloud syncs; anything only there can get clobbered
// by a stale Cloud copy. This file execs after config.cfg, so these win.

// Advanced options -> Contracts: hide the contract HUD entirely.
tf_contract_progress_show 0
tf_contract_competitive_show 0

// Hitsound volume (Advanced options slider). Pitch is pinned further up.
tf_dingaling_volume 0.6

// Last-hit sound: off. Slider values kept as they are in-game so toggling
// tf_dingalingaling_lasthit 1 in console gives the same sound back.
tf_dingalingaling_lasthit 0
tf_dingaling_lasthit_volume 0.75
tf_dingaling_lasthit_pitchmindmg 100
tf_dingaling_lasthit_pitchmaxdmg 100

// Demo support: 2 = auto-record on matchmaking servers only (was 3 = everywhere),
// and auto-delete demos that have no bookmarks / killstreak events.
ds_enable 2
ds_autodelete 1

// Audio: 0 = headphones (was 2 = 2 speakers on the Windows config).
snd_surround_speakers 0
dsp_volume 1
