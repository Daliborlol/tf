// Personal autoexec (mastercomfig 9.x runs this after config.cfg and the
// modules). Settings and binds are pinned here on purpose: config.cfg is
// synced by Steam Cloud, and a stale Cloud copy has overwritten it before.
// Graphics/perf settings live in modules.cfg; per-class stuff in
// game_overrides.cfg + <class>.cfg.

// ---- mouse ----
sensitivity 2.6
// Raw input: avoids the XWayland warp-to-centre bug when pointer lock fails.
m_rawinput 1

// ---- hitsounds ----
tf_dingaling_volume      0.6
tf_dingaling_pitchmindmg 103.459999
tf_dingaling_pitchmaxdmg 104.000000
// last-hit sound off (sliders kept so 'tf_dingalingaling_lasthit 1' sounds the same)
tf_dingalingaling_lasthit        0
tf_dingaling_lasthit_volume      0.75
tf_dingaling_lasthit_pitchmindmg 100
tf_dingaling_lasthit_pitchmaxdmg 100

// ---- gameplay / HUD ----
tf_medigun_autoheal 1
exec yes_viewmodel
cl_hud_minmode 0
cl_spec_carrieditems 1
tf_hud_no_crosshair_on_scope_zoom 0
spec_scoreboard 0
tf_scoreboard_mouse_mode 2

// ---- demos ----
// 2 = auto-record every match; autodelete drops demos without bookmarks or
// killstreaks, so mark good moments with F7 (ds_mark).
ds_enable 2
ds_autodelete 1

// ---- audio ----
// 0 = headphones
snd_surround_speakers 0
dsp_volume 1

// ---- shortcuts ----
alias dc      disconnect
alias stfu    "voice_enable 0"
alias jump    "connect bulb.viora.sh"
alias product "map koth_product_final"
alias prod    "product"
alias ash     "map koth_ashville_final1"
alias upward  "map pl_upward_f12"

// Jetpack: swap to loadout D (preset 3), respawn via soldier, back to pyro
// on the default loadout B (preset 1).
alias jetpack_loadout "load_itempreset 3"
alias default_loadout "load_itempreset 1"
alias jetpack_switch  "tf_respawn_on_loadoutchanges 0; jetpack_loadout; join_class soldier; wait 200; join_class pyro; wait 50; default_loadout; slot2; tf_respawn_on_loadoutchanges 1"

// ---- binds ----
// 1/2/3, q and the mouse wheel are owned by game_overrides.cfg (quickswitch);
// q is reset here too so a pyro q saved in config.cfg doesn't survive a restart.
bind "q" "eq_lastinv"
// Movement uses the mastercomfig null-canceling-movement addon (+mf/+mb/+ml/+mr).
bind "w" "+mf"
bind "a" "+ml"
bind "s" "+mb"
bind "d" "+mr"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+use_action_slot_item"
bind "SEMICOLON" "+use_action_slot_item"
bind "'" "+moveup"
bind "/" "+movedown"
bind "PGUP" "+lookup"
bind "PGDN" "+lookdown"
unbind "ALT"
unbind "\"
unbind "="

bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "+attack3"
bind "h" "+attack3"
bind "MOUSE4" "load_itempreset 1"
bind "MOUSE5" "load_itempreset 0"

bind "0" "jetpack_switch"
bind "KP_INS" "jetpack_switch"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"

bind "b" "lastdisguise"
bind "c" "voice_menu_3"
bind "e" "+helpme"
bind "f" "+inspect"
bind "g" "+taunt"
bind "i" "showmapinfo"
bind "j" "cl_trigger_first_notification"
bind "k" "cl_decline_first_notification"
bind "l" "dropitem"
bind "m" "open_charinfo_direct"
bind "n" "open_charinfo_backpack"
bind "o" "kill"
bind "p" "demo_togglepause"
bind "r" "+reload"
bind "t" "impulse 201"
bind "u" "say_team"
bind "v" "+voicerecord"
bind "x" "voice_menu_2"
bind "y" "say"
bind "z" "voice_menu_1"
bind "-" "disguiseteam"
bind "[" "say_party"
bind "]" "abuse_report_queue"
bind "," "changeclass"
bind "." "changeteam"
bind "`" "toggleconsole"
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"

// numpad: class select + loadout presets
bind "KP_END" "join_class scout"
bind "KP_DOWNARROW" "join_class soldier"
bind "KP_PGDN" "join_class pyro"
bind "KP_LEFTARROW" "join_class demoman"
bind "KP_5" "join_class heavyweapons"
bind "KP_RIGHTARROW" "join_class engineer"
bind "KP_HOME" "join_class medic"
bind "KP_UPARROW" "join_class sniper"
bind "KP_PGUP" "join_class spy"
bind "KP_MINUS" "load_itempreset 2"
bind "KP_PLUS" "load_itempreset 3"

// F-keys (F8-F11 = demo2nut review binds)
bind "F2" "show_quest_log"
unbind "F3"
bind "F4" "player_ready_toggle"
bind "F5" "screenshot"
bind "F6" "save_replay"
bind "F7" "ds_mark"
bind "F8" "d2n_nosac"
bind "F9" "d2n_again"
bind "F10" "d2n_trimin"
bind "F11" "d2n_trimout"
